name: Android APK Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 默认会安装已下线的 'tools' 包导致失败，这里只装 platform-tools
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        shell: bash
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
        run: |
          set -euo pipefail
          if [[ -z "${KEY_JKS:-}" ]]; then
            echo "KEY_JKS is empty: the repo cannot read the signing secret (private repo on a free org needs repo-level secrets)." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          out="$RUNNER_TEMP/signing/release.jks"
          raw="$RUNNER_TEMP/signing/raw.bin"
          printf '%s' "$KEY_JKS" > "$raw"
          # 只输出不含机密内容的诊断信息：长度、非 base64 字符数、原始数据类型
          bad="$(LC_ALL=C tr -d 'A-Za-z0-9+/=_\r\n\t -' < "$raw" | wc -c)"
          echo "KEY_JKS length=$(wc -c < "$raw") non-base64-chars=$bad raw-type=$(file -b "$raw" | cut -c1-40)"
          # 兼容 UTF-8 BOM、换行/空格/CRLF、URL-safe 字符或缺少 padding 的 base64
          clean="$(LC_ALL=C sed -e '1s/^\xEF\xBB\xBF//' "$raw" | LC_ALL=C tr -d ' \r\n\t' | tr '_-' '/+')"
          while (( ${#clean} % 4 != 0 )); do clean="${clean}="; done
          if ! printf '%s' "$clean" | base64 -d > "$out" 2>/dev/null; then
            printf '%s' "$clean" | base64 -d -i > "$out" || true
          fi
          # 若解码结果本身仍是 base64 文本（被编码了两次），再解一次
          if [[ -s "$out" ]] && ! LC_ALL=C grep -q '[^A-Za-z0-9+/=[:space:]]' "$out"; then
            LC_ALL=C tr -d ' \r\n\t' < "$out" | base64 -d > "$out.2" && mv "$out.2" "$out"
          fi
          rm -f "$raw"
          echo "keystore bytes: $(wc -c < "$out") type=$(file -b "$out" | cut -c1-40)"
          test -s "$out"

      - name: Build signed release APK
        shell: bash
        env:
          GRADLE_TASK: assembleRelease
          SIGNING_STORE_FILE: ${{ runner.temp }}/signing/release.jks
          SIGNING_KEY_ALIAS: ${{ vars.ALIAS || secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          # 组织级签名配置在 Windows 下写入，带有 UTF-8 BOM 与 CR/LF，这里统一去掉
          strip() { printf '%s' "$1" | LC_ALL=C sed -e '1s/^\xEF\xBB\xBF//' | LC_ALL=C tr -d '\r\n'; }
          SIGNING_KEY_ALIAS="$(strip "${SIGNING_KEY_ALIAS:-}")"
          SIGNING_KEY_PASSWORD="$(strip "${SIGNING_KEY_PASSWORD:-}")"
          SIGNING_STORE_PASSWORD="$(strip "${SIGNING_STORE_PASSWORD:-}")"
          export SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD SIGNING_STORE_PASSWORD
          if [[ -z "${SIGNING_KEY_ALIAS:-}" ]]; then
            echo "ALIAS is missing. Configure vars.ALIAS or secrets.ALIAS." >&2
            exit 1
          fi

          if [[ -x ./gradlew ]]; then
            GRADLE_CMD=(./gradlew)
          else
            echo "No ./gradlew found; downloading Gradle 8.7 for CI fallback."
            curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
            GRADLE_CMD=("$RUNNER_TEMP/gradle-8.7/bin/gradle")
          fi

          "${GRADLE_CMD[@]}" --no-daemon "$GRADLE_TASK" \
            -Pandroid.injected.signing.store.file="$SIGNING_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD"

      - name: Collect APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          project_name="${GITHUB_REPOSITORY##*/}"
          apk_count=0
          while IFS= read -r apk; do
            apk_count=$((apk_count + 1))
            if [[ "$apk_count" -eq 1 ]]; then
              target="dist/${project_name}.apk"
            else
              target="dist/${project_name}-${apk_count}.apk"
            fi
            cp "$apk" "$target"
          done < <(find . -path '*/build/outputs/apk/release/*.apk' -type f | sort)
          test "$apk_count" -gt 0
          ls -lah dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
